name: mutants
on: workflow_dispatch
jobs:
  mutants:
    runs-on: macos-15
    timeout-minutes: 90 # ~40 mutants × (rebuild + e2e) on a 3-core runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: scripts/mutants.sh
